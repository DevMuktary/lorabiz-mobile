name: Build Mobile Apps (iOS IPA & Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # iOS IPA build temporarily commented out to enable fast ~2 minute Android builds for Google Play Store release.
  # Can be re-enabled whenever an updated iOS IPA test package is needed.
  # build-ios-ipa:
  #   name: Build iOS IPA (Sideloadly Ready)
  #   runs-on: macos-15
  #   ...

  build-android-aab:
    name: Build Android AAB (Google Play Store Release)
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NON_INTERACTIVE: 1
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://lora.quadrox.dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild (Generate Native Android Project)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure Android Release Signing
        working-directory: ./mobile
        run: node scripts/configure-android-signing.js

      - name: Make Gradle Wrapper Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android AAB Bundle for Google Play Store
        working-directory: ./mobile/android
        run: |
          ./gradlew bundleRelease --no-daemon -x lint -x test --stacktrace

      - name: Locate and Verify Google Play AAB Bundle
        working-directory: ./mobile/android
        run: |
          set -e
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "Error: Could not locate compiled .aab in app/build/outputs/bundle/"
            find app/build/outputs/ -type f || true
            exit 1
          fi

          echo "Found Google Play AAB at: $AAB_PATH"
          cp "$AAB_PATH" Lorabiz.aab
          ls -lh Lorabiz.aab

          FILESIZE=$(wc -c < "Lorabiz.aab")
          echo "Generated AAB size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 5000000 ]; then
            echo "Error: Lorabiz.aab is too small ($FILESIZE bytes). AAB does not contain complete bundle."
            exit 1
          fi
          echo "SUCCESS: Lorabiz.aab created and verified for Google Play Store."

      - name: Verify Release Keystore Signature
        working-directory: ./mobile/android
        run: |
          echo "=== Verifying AAB Release Certificate ==="
          jarsigner -verify -verbose -certs Lorabiz.aab | grep -E "(CN=|OU=|O=|Signature|jar verified)" | head -n 30 || true

      - name: Upload Android AAB Artifact (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: Lorabiz-Android-AAB-PlayStore
          path: mobile/android/Lorabiz.aab
          retention-days: 14
